<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - RythuFresh_Sec</title>

    <link rel="stylesheet" href="profile.css">
</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="profile-header">

        <div class="logo">
            🌿 RythuFresh_Sec
        </div>

        <button
            type="button"
            class="back-btn"
            onclick="goBack()">

            ← Back

        </button>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="profile-container">

        <div class="profile-card">

            <!-- PROFILE TITLE -->

            <div class="profile-title">

                <div class="profile-icon">
                    👤
                </div>

                <div>

                    <h1>My Profile</h1>

                    <p>
                        Manage your RythuFresh_Sec account
                    </p>

                </div>

            </div>


            <!-- =================================================
                 PROFILE FORM
            ================================================== -->

            <form
                id="profileForm"
                onsubmit="updateProfile(event)">

                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Your email"
                        autocomplete="email"
                        readonly>

                    <small>
                        Email cannot be changed.
                    </small>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        inputmode="numeric"
                        maxlength="15"
                        required>

                </div>


                <!-- ADDRESS -->

                <div class="form-group">

                    <label for="address">
                        Saved Address
                    </label>

                    <textarea
                        id="address"
                        rows="4"
                        placeholder="Enter your delivery address"
                        autocomplete="street-address"></textarea>

                </div>


                <!-- BUTTONS -->

                <div class="profile-actions">

                   <button
    type="button"
    class="save-btn"
    onclick="updateProfile(event)"
>
    Save Changes
</button>

                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="loadProfile()">

                        Cancel

                    </button>

                </div>


                <!-- PROFILE MESSAGE -->

                <div
                    id="profileMessage"
                    class="profile-message"
                    role="alert">

                </div>

            </form>


            <!-- =================================================
                 ACCOUNT SETTINGS
            ================================================== -->

            <div class="account-actions">

                <h2>
                    Account Settings
                </h2>


                <!-- CHANGE PASSWORD -->

                <button
                    type="button"
                    class="password-btn"
                    onclick="openChangePassword()">

                    🔐 Change Password

                </button>


                <!-- LOGOUT -->

                <button
                    type="button"
                    class="logout-account-btn"
                    onclick="logout()">

                    🚪 Logout

                </button>

            </div>

        </div>

    </main>


    <!-- =====================================================
         CHANGE PASSWORD MODAL
    ====================================================== -->

    <div
        id="passwordModal"
        class="password-modal">

        <div class="password-modal-content">

            <!-- MODAL HEADER -->

            <div class="password-modal-header">

                <div>

                    <h2>
                        🔐 Change Password
                    </h2>

                    <p>
                        Update your RythuFresh_Sec account password
                    </p>

                </div>

                <button
                    type="button"
                    class="close-password-btn"
                    onclick="closeChangePassword()">

                    ×

                </button>

            </div>


            <!-- CHANGE PASSWORD FORM -->

            <form
                id="changePasswordForm"
                onsubmit="changePassword(event)">

                <!-- CURRENT PASSWORD -->

                <div class="form-group">

                    <label for="currentPassword">
                        Current Password
                    </label>

                    <input
                        type="password"
                        id="currentPassword"
                        placeholder="Enter current password"
                        autocomplete="current-password"
                        required>

                </div>


                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        minlength="6"
                        autocomplete="new-password"
                        required>

                    <small>
                        Password must contain at least 6 characters.
                    </small>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="6"
                        autocomplete="new-password"
                        required>

                </div>


                <!-- PASSWORD MESSAGE -->

                <div
                    id="passwordMessage"
                    class="password-message"
                    role="alert">

                </div>


                <!-- PASSWORD BUTTONS -->

                <div class="password-actions">

                    <button
                        type="submit"
                        class="update-password-btn">

                        🔐 Update Password

                    </button>

                    <button
                        type="button"
                        class="password-cancel-btn"
                        onclick="closeChangePassword()">

                        Cancel

                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="profile.js"></script>

</body>

</html>
