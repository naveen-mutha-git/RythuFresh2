<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RythuFresh_Sec - Vegetables</title>

    <link rel="stylesheet"
          href="vegetables.css">

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="admin-header">

    <div class="logo">
        🌿 RythuFresh_Sec Admin
    </div>

    <button class="logout-btn"
            onclick="logout()">

        Logout

    </button>

</header>



<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <h3>ADMIN PANEL</h3>


    <a href="dashboard.html">
        🏠 Dashboard
    </a>


    <a href="vegetables.html"
       class="active">

        🥬 Vegetables

    </a>


    <a href="orders.html">
        📦 Orders
    </a>


    <a href="customers.html">
        👥 Customers
    </a>

</aside>



<!-- ================= MAIN CONTENT ================= -->

<main class="main-content">


    <div class="page-header">

        <div>

            <h1>Vegetables</h1>

            <p>
                Manage RythuFresh_Sec vegetables
            </p>

        </div>


        <button class="add-btn"
                onclick="openAddForm()">

            + Add Vegetable

        </button>

    </div>



    <!-- ================= ADD / EDIT FORM ================= -->

    <section class="form-card"
             id="vegetableFormCard"
             style="display:none;">

        <h2 id="formTitle">
            Add Vegetable
        </h2>


        <form id="vegetableForm">


            <input type="hidden"
                   id="vegetableId">


            <div class="form-grid">


                <div class="form-group">

                    <label>
                        Vegetable Name
                    </label>

                    <input type="text"
                           id="name"
                           required>

                </div>



                <div class="form-group">

                    <label>
                        Telugu Name
                    </label>

                    <input type="text"
                           id="teluguName">

                </div>



                <div class="form-group">

                    <label>
                        Price
                    </label>

                    <input type="number"
                           id="price"
                           step="0.01"
                           min="0"
                           required>

                </div>



                <div class="form-group">

                    <label>
                        Unit
                    </label>

                    <input type="text"
                           id="unit"
                           placeholder="kg / bunch / piece"
                           required>

                </div>



                <div class="form-group">

                    <label>
                        Quantity
                    </label>

                    <input type="number"
                           id="quantity"
                           min="0"
                           required>

                </div>



                <div class="form-group">

                    <label>
                        Image URL
                    </label>

                    <input type="text"
                           id="imageUrl">

                </div>



                <div class="form-group full-width">

                    <label>
                        Description
                    </label>

                    <textarea id="description"
                              rows="3"></textarea>

                </div>



                <div class="form-group full-width">

                    <label>
                        Health Benefits
                    </label>

                    <textarea id="healthBenefits"
                              rows="3"></textarea>

                </div>


            </div>



            <div class="form-buttons">

<button type="submit"
        class="save-btn"
        id="saveBtn">
    Save Vegetable
</button>


                <button type="button"
                        class="cancel-btn"
                          id="cancelBtn"
                        onclick="closeForm()">

                    Cancel

                </button>

            </div>


        </form>

    </section>



    <!-- ================= VEGETABLE LIST ================= -->

    <section class="table-card">

        <div class="table-header">

            <h2>
                Vegetable List
            </h2>

            <span id="vegetableTotal">
                0 vegetables
            </span>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Image</th>

                        <th>Name</th>

                        <th>Telugu Name</th>

                        <th>Price</th>

                        <th>Unit</th>

                        <th>Quantity</th>

                        <th>Stock</th>

                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="vegetableTableBody">

                    <tr>

                        <td colspan="9"
                            class="loading">

                            Loading vegetables...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


</main>



<script src="vegetables.js"></script>


</body>

</html>
