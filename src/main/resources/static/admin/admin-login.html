<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RythuFresh Admin Login</title>

    <link rel="stylesheet"
          href="admin-login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">

            🥬

        </div>

        <h1>

            RythuFresh Admin

        </h1>

        <p>

            Login to manage your vegetable store

        </p>

        <div class="input-group">

            <label>

                Username

            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username">

        </div>

        <div class="input-group">

            <label>

                Password

            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password">

        </div>

        <button
            class="login-btn"
            onclick="login()">

            Login

        </button>
       <a href="forgot-password.html"
   class="forgot-password">
    Forgot Password?
</a>
    </div>

</div>

<script src="admin-login.js"></script>

</body>

</html>
